<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="-apple-system,system-ui,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="t1">
  <title id="t1">TrustZone SoC 내 Normal World와 Secure World</title>
  <defs>
    <marker id="ah1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#536B81"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="816" height="396" rx="12" fill="#ffffff" stroke="#d7dce3"/>
  <text x="410" y="40" text-anchor="middle" fill="#24324a" font-size="18" font-weight="700">TrustZone SoC 내 Normal World와 Secure World</text>

  <!-- Normal World -->
  <rect x="55" y="66" width="300" height="194" rx="9" fill="#E9F2FF" stroke="#7CA9DF" stroke-width="1.4"/>
  <text x="205" y="94" text-anchor="middle" fill="#245A99" font-size="15" font-weight="700">Normal World (NS = 1)</text>
  <rect x="85" y="114" width="240" height="46" rx="5" fill="#ffffff" stroke="#91B5E2"/>
  <text x="205" y="142" text-anchor="middle" fill="#243448" font-size="13.5">Client Application (CA)</text>
  <rect x="85" y="176" width="240" height="58" rx="5" fill="#ffffff" stroke="#91B5E2"/>
  <text x="205" y="211" text-anchor="middle" fill="#243448" font-size="13.5">Linux / Android (REE OS)</text>

  <!-- Secure World -->
  <rect x="465" y="66" width="300" height="194" rx="9" fill="#E5F5ED" stroke="#68A98C" stroke-width="1.4"/>
  <text x="615" y="94" text-anchor="middle" fill="#176B49" font-size="15" font-weight="700">Secure World (NS = 0)</text>
  <rect x="495" y="114" width="240" height="46" rx="5" fill="#ffffff" stroke="#86C3A4"/>
  <text x="615" y="142" text-anchor="middle" fill="#243448" font-size="13.5">Trusted Application (S-EL0)</text>
  <rect x="495" y="176" width="240" height="58" rx="5" fill="#ffffff" stroke="#86C3A4"/>
  <text x="615" y="211" text-anchor="middle" fill="#243448" font-size="13.5">Trusted OS (S-EL1)</text>

  <!-- Secure Monitor -->
  <rect x="290" y="312" width="240" height="56" rx="7" fill="#FBF2D5" stroke="#D9B65A" stroke-width="1.4"/>
  <text x="410" y="337" text-anchor="middle" fill="#6B5618" font-size="14.5" font-weight="700">Secure Monitor (EL3)</text>
  <text x="410" y="355" text-anchor="middle" fill="#8a7430" font-size="11">두 세계 사이의 유일한 관문</text>

  <!-- arrows to monitor -->
  <line x1="205" y1="260" x2="330" y2="314" stroke="#536B81" stroke-width="1.6" marker-start="url(#ah1)" marker-end="url(#ah1)"/>
  <line x1="615" y1="260" x2="490" y2="314" stroke="#536B81" stroke-width="1.6" marker-start="url(#ah1)" marker-end="url(#ah1)"/>
</svg>
