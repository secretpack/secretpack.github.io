<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif" role="img" aria-labelledby="t1">
  <title id="t1">TrustZone: 하나의 SoC, 두 개의 세계</title>
  <defs>
    <marker id="ah1" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="816" height="396" rx="14" fill="#1b1f27" stroke="#30363d"/>
  <text x="410" y="40" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="600">TrustZone — 하나의 SoC, 두 개의 세계</text>

  <!-- Normal World -->
  <rect x="55" y="68" width="300" height="192" rx="10" fill="#11263f" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="205" y="96" text-anchor="middle" fill="#79b8ff" font-size="15" font-weight="600">Normal World (NS = 1)</text>
  <rect x="85" y="116" width="240" height="46" rx="6" fill="#0d1b2e" stroke="#3b6ea5"/>
  <text x="205" y="144" text-anchor="middle" fill="#cdd9e5" font-size="14">일반 앱 (User Apps)</text>
  <rect x="85" y="178" width="240" height="58" rx="6" fill="#0d1b2e" stroke="#3b6ea5"/>
  <text x="205" y="213" text-anchor="middle" fill="#cdd9e5" font-size="14">Linux / Android 커널</text>

  <!-- Secure World -->
  <rect x="465" y="68" width="300" height="192" rx="10" fill="#10271a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="615" y="96" text-anchor="middle" fill="#56d364" font-size="15" font-weight="600">Secure World (NS = 0)</text>
  <rect x="495" y="116" width="240" height="46" rx="6" fill="#0c1f12" stroke="#2a7d3f"/>
  <text x="615" y="144" text-anchor="middle" fill="#d2e8d6" font-size="14">Trusted App (S-EL0)</text>
  <rect x="495" y="178" width="240" height="58" rx="6" fill="#0c1f12" stroke="#2a7d3f"/>
  <text x="615" y="213" text-anchor="middle" fill="#d2e8d6" font-size="14">Trusted OS (S-EL1)</text>

  <!-- Secure Monitor -->
  <rect x="290" y="312" width="240" height="56" rx="8" fill="#2d2612" stroke="#e3b341" stroke-width="1.5"/>
  <text x="410" y="338" text-anchor="middle" fill="#f2cc60" font-size="15" font-weight="600">Secure Monitor (EL3)</text>
  <text x="410" y="356" text-anchor="middle" fill="#b9a24a" font-size="11">두 세계 사이의 유일한 관문</text>

  <!-- arrows to monitor -->
  <line x1="205" y1="260" x2="330" y2="314" stroke="#8b949e" stroke-width="1.6" marker-start="url(#ah1)" marker-end="url(#ah1)"/>
  <line x1="615" y1="260" x2="490" y2="314" stroke="#8b949e" stroke-width="1.6" marker-start="url(#ah1)" marker-end="url(#ah1)"/>
</svg>
