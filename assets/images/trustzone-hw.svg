<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 400" font-family="-apple-system,system-ui,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="tz">
  <title id="tz">ARM TrustZone: NS 비트로 하드웨어 자원을 분리</title>
  <defs>
    <marker id="ahz" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#536B81"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="836" height="396" rx="12" fill="#ffffff" stroke="#d7dce3"/>
  <text x="420" y="32" text-anchor="middle" fill="#24324a" font-size="18" font-weight="700">ARM TrustZone — NS 비트로 하드웨어 자원 분리</text>

  <!-- NS bit -->
  <rect x="48" y="58" width="150" height="48" rx="7" fill="#FBF2D5" stroke="#D9B65A" stroke-width="1.4"/>
  <text x="123" y="80" text-anchor="middle" fill="#6B5618" font-size="14" font-weight="700">NS 비트</text>
  <text x="123" y="96" text-anchor="middle" fill="#8a7430" font-size="10.5">보안 상태 비트</text>

  <!-- arrow NS -> bus -->
  <line x1="198" y1="82" x2="240" y2="82" stroke="#536B81" stroke-width="1.6" marker-end="url(#ahz)"/>

  <!-- system bus bar -->
  <rect x="244" y="62" width="556" height="40" rx="7" fill="#D5DDE9" stroke="#8796A9" stroke-width="1.3"/>
  <text x="522" y="87" text-anchor="middle" fill="#29384A" font-size="12.5" font-weight="600">시스템 버스 — 모든 접근에 NS 태그 전파</text>

  <!-- resource groups -->
  <!-- CPU -->
  <line x1="330" y1="102" x2="330" y2="130" stroke="#8796A9" stroke-width="1.3" marker-end="url(#ahz)"/>
  <text x="330" y="124" text-anchor="middle" fill="#29384A" font-size="12.5" font-weight="600">CPU 코어 상태</text>
  <rect x="242" y="134" width="176" height="166" rx="8" fill="#F3F5F8" stroke="#c9d1da"/>
  <rect x="254" y="148" width="152" height="66" rx="5" fill="#E9F2FF" stroke="#7CA9DF"/>
  <text x="330" y="186" text-anchor="middle" fill="#245A99" font-size="12.5" font-weight="600">Non-Secure</text>
  <rect x="254" y="224" width="152" height="66" rx="5" fill="#E5F5ED" stroke="#68A98C"/>
  <text x="330" y="262" text-anchor="middle" fill="#176B49" font-size="12.5" font-weight="600">Secure</text>

  <!-- Memory -->
  <line x1="522" y1="102" x2="522" y2="130" stroke="#8796A9" stroke-width="1.3" marker-end="url(#ahz)"/>
  <text x="522" y="124" text-anchor="middle" fill="#29384A" font-size="12.5" font-weight="600">메모리 (TZASC)</text>
  <rect x="434" y="134" width="176" height="166" rx="8" fill="#F3F5F8" stroke="#c9d1da"/>
  <rect x="446" y="148" width="152" height="66" rx="5" fill="#E9F2FF" stroke="#7CA9DF"/>
  <text x="522" y="186" text-anchor="middle" fill="#245A99" font-size="12.5" font-weight="600">Non-Secure</text>
  <rect x="446" y="224" width="152" height="66" rx="5" fill="#E5F5ED" stroke="#68A98C"/>
  <text x="522" y="262" text-anchor="middle" fill="#176B49" font-size="12.5" font-weight="600">Secure</text>

  <!-- Peripherals -->
  <line x1="714" y1="102" x2="714" y2="130" stroke="#8796A9" stroke-width="1.3" marker-end="url(#ahz)"/>
  <text x="714" y="124" text-anchor="middle" fill="#29384A" font-size="12.5" font-weight="600">주변장치 (TZPC)</text>
  <rect x="626" y="134" width="176" height="166" rx="8" fill="#F3F5F8" stroke="#c9d1da"/>
  <rect x="638" y="148" width="152" height="66" rx="5" fill="#E9F2FF" stroke="#7CA9DF"/>
  <text x="714" y="186" text-anchor="middle" fill="#245A99" font-size="12.5" font-weight="600">Non-Secure</text>
  <rect x="638" y="224" width="152" height="66" rx="5" fill="#E5F5ED" stroke="#68A98C"/>
  <text x="714" y="262" text-anchor="middle" fill="#176B49" font-size="12.5" font-weight="600">Secure</text>

  <!-- legend -->
  <rect x="250" y="328" width="16" height="13" rx="2" fill="#E9F2FF" stroke="#7CA9DF"/>
  <text x="272" y="339" fill="#29384A" font-size="11.5">Non-Secure = Normal World (REE)</text>
  <rect x="500" y="328" width="16" height="13" rx="2" fill="#E5F5ED" stroke="#68A98C"/>
  <text x="522" y="339" fill="#29384A" font-size="11.5">Secure = Secure World (TEE)</text>
</svg>
