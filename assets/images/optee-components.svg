<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" font-family="-apple-system,system-ui,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif" role="img" aria-labelledby="t3">
  <title id="t3">OP-TEE 구성 요소와 호출 흐름</title>
  <defs>
    <marker id="ah3" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#536B81"/>
    </marker>
    <marker id="ah3d" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8796A9"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="876" height="436" rx="12" fill="#ffffff" stroke="#d7dce3"/>
  <text x="440" y="32" text-anchor="middle" fill="#24324a" font-size="18" font-weight="700">OP-TEE 구성 요소와 호출 흐름</text>

  <!-- world regions -->
  <rect x="40" y="70" width="300" height="346" rx="10" fill="#EEF5FD" stroke="#cfe0f3"/>
  <text x="190" y="93" text-anchor="middle" fill="#245A99" font-size="14" font-weight="700">Normal World</text>
  <rect x="540" y="70" width="300" height="346" rx="10" fill="#EDF8F1" stroke="#c7e5d3"/>
  <text x="690" y="93" text-anchor="middle" fill="#176B49" font-size="14" font-weight="700">Secure World</text>

  <!-- Left column boxes -->
  <rect x="70" y="108" width="240" height="64" rx="7" fill="#ffffff" stroke="#7CA9DF" stroke-width="1.3"/>
  <text x="190" y="134" text-anchor="middle" fill="#243448" font-size="14" font-weight="600">Client Application (CA)</text>
  <text x="190" y="154" text-anchor="middle" fill="#4a6a93" font-size="12">libteec (TEE Client API)</text>

  <rect x="70" y="214" width="240" height="64" rx="7" fill="#ffffff" stroke="#7CA9DF" stroke-width="1.3"/>
  <text x="190" y="240" text-anchor="middle" fill="#243448" font-size="14" font-weight="600">OP-TEE 커널 드라이버</text>
  <text x="190" y="260" text-anchor="middle" fill="#4a6a93" font-size="12">/dev/tee0 · /dev/teepriv0</text>

  <rect x="70" y="326" width="240" height="60" rx="7" fill="#ffffff" stroke="#7CA9DF" stroke-width="1.3"/>
  <text x="190" y="350" text-anchor="middle" fill="#243448" font-size="14" font-weight="600">tee-supplicant (데몬)</text>
  <text x="190" y="370" text-anchor="middle" fill="#4a6a93" font-size="12">보안 저장 · 파일 등 뒤처리</text>

  <!-- Right column boxes -->
  <rect x="570" y="108" width="240" height="64" rx="7" fill="#ffffff" stroke="#86C3A4" stroke-width="1.3"/>
  <text x="690" y="134" text-anchor="middle" fill="#243448" font-size="14" font-weight="600">Trusted Application (TA)</text>
  <text x="690" y="154" text-anchor="middle" fill="#4a7d63" font-size="12">S-EL0</text>

  <rect x="570" y="214" width="240" height="64" rx="7" fill="#E5F5ED" stroke="#68A98C" stroke-width="1.3"/>
  <text x="690" y="240" text-anchor="middle" fill="#243448" font-size="14" font-weight="600">OP-TEE OS</text>
  <text x="690" y="260" text-anchor="middle" fill="#4a7d63" font-size="12">Trusted OS · S-EL1</text>

  <!-- Secure Monitor in the middle, aligned with driver / OP-TEE OS row -->
  <rect x="364" y="220" width="152" height="52" rx="7" fill="#FBF2D5" stroke="#D9B65A" stroke-width="1.3"/>
  <text x="440" y="242" text-anchor="middle" fill="#6B5618" font-size="13" font-weight="700">Secure Monitor</text>
  <text x="440" y="260" text-anchor="middle" fill="#8a7430" font-size="11">EL3</text>

  <!-- CA -> driver -->
  <line x1="190" y1="172" x2="190" y2="212" stroke="#536B81" stroke-width="1.6" marker-end="url(#ah3)"/>
  <text x="200" y="196" fill="#536B81" font-size="12">ioctl</text>

  <!-- SMC: driver -> monitor -> OP-TEE OS (one straight horizontal row) -->
  <text x="440" y="208" text-anchor="middle" fill="#b07d1a" font-size="12.5" font-weight="700">SMC</text>
  <line x1="310" y1="246" x2="362" y2="246" stroke="#536B81" stroke-width="1.6" marker-end="url(#ah3)"/>
  <line x1="516" y1="246" x2="568" y2="246" stroke="#536B81" stroke-width="1.6" marker-end="url(#ah3)"/>

  <!-- TA <-> OP-TEE OS -->
  <line x1="690" y1="172" x2="690" y2="212" stroke="#536B81" stroke-width="1.6" marker-start="url(#ah3)" marker-end="url(#ah3)"/>

  <!-- RPC: OP-TEE OS -> tee-supplicant (orthogonal) -->
  <path d="M690,278 V352 H312" fill="none" stroke="#8796A9" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ah3d)"/>
  <text x="500" y="344" text-anchor="middle" fill="#6b7686" font-size="12.5" font-weight="700">RPC</text>
</svg>
