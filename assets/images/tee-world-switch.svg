<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif" role="img" aria-labelledby="t2">
  <title id="t2">세계 전환: SMC와 Secure Monitor</title>
  <defs>
    <marker id="ah2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="636" height="466" rx="14" fill="#1b1f27" stroke="#30363d"/>
  <text x="320" y="34" text-anchor="middle" fill="#e6edf3" font-size="19" font-weight="600">세계 전환 — SMC와 Secure Monitor</text>

  <!-- A: Normal World kernel -->
  <rect x="170" y="52" width="300" height="56" rx="8" fill="#11263f" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="320" y="85" text-anchor="middle" fill="#cdd9e5" font-size="15">Normal World 커널 (REE)</text>

  <!-- B: Secure Monitor -->
  <rect x="170" y="164" width="300" height="56" rx="8" fill="#2d2612" stroke="#e3b341" stroke-width="1.5"/>
  <text x="320" y="197" text-anchor="middle" fill="#f2cc60" font-size="15">Secure Monitor (EL3)</text>

  <!-- C: Trusted OS -->
  <rect x="170" y="276" width="300" height="56" rx="8" fill="#10271a" stroke="#3fb950" stroke-width="1.5"/>
  <text x="320" y="309" text-anchor="middle" fill="#d2e8d6" font-size="15">Trusted OS (S-EL1)</text>

  <!-- D: Trusted App -->
  <rect x="170" y="388" width="300" height="56" rx="8" fill="#0c1f12" stroke="#2a7d3f" stroke-width="1.5"/>
  <text x="320" y="421" text-anchor="middle" fill="#d2e8d6" font-size="15">Trusted App (S-EL0)</text>

  <!-- down arrows -->
  <line x1="320" y1="108" x2="320" y2="162" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah2)"/>
  <text x="332" y="140" fill="#9da7b3" font-size="12.5">SMC 명령 실행</text>

  <line x1="320" y1="220" x2="320" y2="274" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah2)"/>
  <text x="332" y="252" fill="#9da7b3" font-size="12.5">NS 비트 전환 · 컨텍스트 저장/복원</text>

  <line x1="320" y1="332" x2="320" y2="386" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah2)"/>
  <text x="332" y="364" fill="#9da7b3" font-size="12.5">TA 호출</text>

  <!-- return path -->
  <path d="M470,416 H520 V80 H472" fill="none" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah2)"/>
  <text transform="translate(540,248) rotate(90)" text-anchor="middle" fill="#7d8590" font-size="12.5">결과 반환 (복귀)</text>
</svg>
